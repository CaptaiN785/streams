<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<meta name="referrer" content="no-referrer">
<meta name="color-scheme" content="dark">
<title>streams — kryl</title>
<link rel="icon" href="favicon.png">
<style>
@font-face { font-family: 'JetBrains Mono'; font-weight: 400; font-display: swap; src: url(fonts/JetBrainsMono-Regular.ttf) format('truetype'); }
@font-face { font-family: 'JetBrains Mono'; font-weight: 700; font-display: swap; src: url(fonts/JetBrainsMono-Bold.ttf) format('truetype'); }
@font-face { font-family: 'JetBrains Mono'; font-weight: 800; font-display: swap; src: url(fonts/JetBrainsMono-ExtraBold.ttf) format('truetype'); }

/* kryl.dev brand tokens — ~/personal/kryl/theme.css */
:root {
  --kryl-bg: #0f1014;
  --kryl-surface: #08090c;
  --kryl-fg: #e8e6e0;
  --kryl-accent: #f5b841;
  --kryl-muted: #7e7f8a;
  --kryl-border: #2c2d36;
  --kryl-font: 'JetBrains Mono', 'Courier New', monospace;
}
* { box-sizing: border-box; }
html { background: var(--kryl-bg); }
body {
  margin: 0 auto; padding: 48px 16px 80px; max-width: 920px;
  background: var(--kryl-bg); color: var(--kryl-fg);
  font: 400 14px/1.6 var(--kryl-font);
}
a { color: inherit; text-decoration: none; }
a:focus-visible, input:focus-visible, button:focus-visible { outline: 2px solid var(--kryl-accent); outline-offset: 2px; }

header { display: flex; align-items: baseline; justify-content: space-between; gap: 16px; flex-wrap: wrap; }
.kryl-wordmark { font-weight: 800; font-size: 32px; letter-spacing: -0.05em; display: inline-flex; align-items: baseline; }
.kryl-wordmark .path { color: var(--kryl-muted); }
.kryl-wordmark i { display: inline-block; width: 0.42em; height: 0.78em; margin-left: 0.2em; background: var(--kryl-accent); }
.meta { color: var(--kryl-muted); font-size: 12px; }

.bar { position: sticky; top: 0; z-index: 1; display: flex; gap: 8px; margin: 24px 0 0; padding: 12px 0; background: var(--kryl-bg); }
.chips { display: flex; flex-wrap: wrap; gap: 8px; padding-bottom: 12px; border-bottom: 1px solid var(--kryl-border); }
.bar input {
  flex: 1; min-width: 0; padding: 10px 12px; font: inherit; color: var(--kryl-fg);
  background: var(--kryl-surface); border: 1px solid var(--kryl-border); border-radius: 4px;
}
.bar input::placeholder { color: var(--kryl-muted); }
.chips button {
  padding: 6px 12px; font: inherit; font-weight: 700; color: var(--kryl-muted); cursor: pointer;
  background: var(--kryl-surface); border: 1px solid var(--kryl-border); border-radius: 4px;
}
.chips button[aria-pressed="true"] { color: var(--kryl-bg); background: var(--kryl-accent); border-color: var(--kryl-accent); }

h2 { margin: 36px 0 8px; font-size: 14px; font-weight: 700; display: flex; align-items: baseline; gap: 0; }
h2 .prompt { color: var(--kryl-muted); }
h2 .count { margin-left: 10px; color: var(--kryl-muted); font-weight: 400; font-size: 12px; }

ol { list-style: none; margin: 0; padding: 0; counter-reset: row; }
li {
  counter-increment: row; display: grid; grid-template-columns: 28px 1fr auto; gap: 4px 12px; align-items: baseline;
  padding: 10px 8px; border-bottom: 1px solid var(--kryl-border);
}
li::before { content: counter(row, decimal-leading-zero); color: var(--kryl-muted); font-size: 12px; }
li:hover { background: var(--kryl-surface); }
li[hidden], section[hidden] { display: none; }

.sites { display: flex; flex-wrap: wrap; align-items: baseline; gap: 4px 10px; min-width: 0; }
.site { display: inline-flex; align-items: baseline; gap: 6px; }
.name { border-bottom: 1px solid transparent; }
.name.primary { font-weight: 700; }
.name:hover { border-bottom-color: var(--kryl-accent); }
.or { color: var(--kryl-muted); font-size: 12px; }
.mirror {
  min-width: 20px; padding: 0 5px; text-align: center; font-size: 11px; line-height: 18px; color: var(--kryl-muted);
  border: 1px solid var(--kryl-border); border-radius: 3px;
}
.mirror:hover { color: var(--kryl-fg); border-color: var(--kryl-muted); }

.tags { display: flex; flex-wrap: wrap; gap: 6px; justify-content: flex-end; font-size: 11px; color: var(--kryl-muted); }
.tag.hot { color: var(--kryl-fg); font-weight: 700; }
.tag + .tag::before { content: "·"; margin-right: 6px; color: var(--kryl-border); }

.empty { margin: 48px 0; color: var(--kryl-muted); }

/* list-shaped placeholder while sites.json loads */
.skeleton { margin-top: 36px; }
.skeleton i { display: block; height: 14px; margin: 14px 8px 27px; border-radius: 3px; background: var(--kryl-border); animation: pulse 1.2s ease-in-out infinite; }
.skeleton i:first-child { width: 120px; margin-bottom: 22px; }
.skeleton i:nth-child(even) { width: 62%; }
.skeleton i:nth-child(3n) { width: 44%; }
@keyframes pulse { 50% { opacity: 0.4; } }
@media (prefers-reduced-motion: reduce) { .skeleton i { animation: none; } }

footer { margin-top: 56px; color: var(--kryl-muted); font-size: 12px; }

@media (max-width: 640px) {
  body { padding-top: 28px; }
  li { grid-template-columns: 28px 1fr; }
  .tags { grid-column: 2; justify-content: flex-start; }
}
</style>
</head>
<body>
<header>
  <span class="kryl-wordmark"><span class="path">~/</span>streams<i></i></span>
  <span class="meta"><span id="total"></span> stream aggregators · movies / tv / anime</span>
</header>

<div class="bar">
  <input id="q" type="search" placeholder="filter by name or tag…" autocomplete="off" aria-label="Filter sites">
</div>
<div class="chips" role="group" aria-label="Filter by type">
  <button type="button" data-tag="movies" aria-pressed="false">Movies</button>
  <button type="button" data-tag="tv" aria-pressed="false">Series</button>
  <button type="button" data-tag="anime" aria-pressed="false">Anime</button>
  <button type="button" data-tag="4k" aria-pressed="false">4K</button>
</div>

<main id="list">
<div class="skeleton" id="skeleton" role="progressbar" aria-label="Loading the site list"><i></i><i></i><i></i><i></i><i></i><i></i><i></i></div>
<p class="empty" id="empty" hidden>no match.</p>
<p class="empty" id="failed" hidden>could not load sites.json — reload to try again.</p>
</main>

<footer>Use an adblocker (uBlock Origin). Numbered boxes are mirrors of the site before them.</footer>

<script>
(function () {
  var q = document.getElementById('q');
  var chips = [].slice.call(document.querySelectorAll('.chips button'));
  var list = document.getElementById('list');
  var rows = [], sections = [];
  var TIERS = [['top', 'top picks'], ['good', 'recommended'], ['rest', 'everything else']];

  function el(tag, cls, text) {
    var node = document.createElement(tag);
    if (cls) node.className = cls;
    if (text != null) node.textContent = text;
    return node;
  }
  function link(cls, url, text) {
    var a = el('a', cls, text);
    a.href = url; a.target = '_blank'; a.rel = 'noopener noreferrer';
    return a;
  }
  // one sites.json entry -> <li>; data-tags is what the chips match, never the search text
  function row(entry) {
    var li = el('li'), sites = el('div', 'sites'), tags = el('div', 'tags');
    entry.sites.forEach(function (s, i) {
      if (i) sites.appendChild(el('span', 'or', 'or'));
      var site = el('span', 'site');
      site.appendChild(link(i ? 'name' : 'name primary', s.url, s.name));
      s.mirrors.forEach(function (url, n) {
        var m = link('mirror', url, n + 2);
        m.title = s.name + ' mirror ' + (n + 2);
        site.appendChild(m);
      });
      sites.appendChild(site);
    });
    entry.tags.forEach(function (t) { tags.appendChild(el('span', t === '4K' ? 'tag hot' : 'tag', t)); });
    var names = entry.sites.map(function (s) { return s.name; });
    li.setAttribute('data-search', names.concat(entry.tags).join(' ').toLowerCase());
    li.setAttribute('data-tags', entry.tags.join('|').toLowerCase());
    li.appendChild(sites); li.appendChild(tags);
    return li;
  }
  function render(entries) {
    var anchor = document.getElementById('empty');
    TIERS.forEach(function (tier) {
      var sec = el('section'), h2 = el('h2'), ol = el('ol');
      sec.setAttribute('data-tier', tier[0]);
      h2.appendChild(el('span', 'prompt', '~/'));
      h2.appendChild(document.createTextNode(tier[1]));
      h2.appendChild(el('span', 'count'));
      entries.forEach(function (x) { if (x.tier === tier[0]) ol.appendChild(row(x)); });
      sec.appendChild(h2); sec.appendChild(ol);
      list.insertBefore(sec, anchor);
      sections.push(sec);
    });
    rows = [].slice.call(list.querySelectorAll('li'));
    document.getElementById('total').textContent = entries.length;
  }

  function apply() {
    if (!rows.length) return;
    var term = q.value.trim().toLowerCase(), shown = 0;
    var wanted = chips.filter(function (b) { return b.getAttribute('aria-pressed') === 'true'; })
      .map(function (b) { return b.getAttribute('data-tag'); });
    rows.forEach(function (li) {
      var tags = li.getAttribute('data-tags').split('|');
      var ok = li.getAttribute('data-search').indexOf(term) !== -1 &&
        wanted.every(function (t) { return tags.indexOf(t) !== -1; });
      li.hidden = !ok;
      if (ok) shown++;
    });
    sections.forEach(function (sec) {
      var n = sec.querySelectorAll('li:not([hidden])').length;
      sec.hidden = n === 0;
      sec.querySelector('.count').textContent = n;
    });
    document.getElementById('empty').hidden = shown !== 0;
  }
  q.addEventListener('input', apply);
  chips.forEach(function (b) {
    b.addEventListener('click', function () {
      b.setAttribute('aria-pressed', b.getAttribute('aria-pressed') === 'true' ? 'false' : 'true');
      apply();
    });
  });

  fetch('sites.json')
    .then(function (res) {
      if (!res.ok) throw new Error('sites.json: HTTP ' + res.status);
      return res.json();
    })
    .then(function (entries) {
      if (!Array.isArray(entries) || !entries.length) throw new Error('sites.json: expected a non-empty array');
      render(entries);
      apply();
    })
    .catch(function (err) {
      console.error(err);
      sections.forEach(function (sec) { sec.remove(); });
      rows = [];
      document.getElementById('failed').hidden = false;
    })
    .then(function () { document.getElementById('skeleton').remove(); });
})();
</script>
</body>
</html>
